<dialog class="event-detail-dialog" id="eventDetailDialog"><div class="event-detail-head"><div><p class="eyebrow">CHI TIẾT SỰ KIỆN</p><h2 id="eventDetailTitle"></h2><p class="event-detail-time" id="eventDetailTime"></p></div><button type="button" class="close-button" data-close-detail aria-label="Đóng">×</button></div><div class="event-detail-meta"><span class="category-tag" id="eventDetailCategory"></span><a id="eventDetailZoom" class="event-detail-zoom" target="_blank" rel="noreferrer" hidden>Tham gia Zoom ↗</a></div><div class="event-detail-description" id="eventDetailDescription"></div><section class="event-status-editor"><label>Trạng thái lần này<select id="eventOccurrenceStatus"><option value="planned">Theo kế hoạch</option><option value="cancelled">Đã hủy</option><option value="rescheduled">Đổi lịch</option></select></label><label>Ghi chú hoặc lịch thay thế <span class="optional">Tùy chọn</span><textarea id="eventOccurrenceNote" rows="2" maxlength="300" placeholder="Ví dụ: Chuyển sang thứ Tư lúc 18:00"></textarea></label><button type="button" class="secondary-button" id="saveOccurrenceStatus">Lưu trạng thái</button><small class="status-save-message" id="statusSaveMessage"></small></section><section class="event-detail-missions"><h3>Mission nhỏ</h3><div class="event-detail-mission-list" id="eventDetailMissions"></div></section></dialog>

<dialog class="event-dialog" id="eventDialog"><form id="eventForm" data-period="{{ period }}" data-category-filter="{{ category_filter }}"><input type="hidden" name="event_id"><div class="modal-head"><div><p class="eyebrow">THÊM VÀO LỊCH</p><h2 id="eventDialogTitle">Tạo sự kiện mới</h2></div><button type="button" class="close-button" data-close-modal aria-label="Đóng">×</button></div><label class="field-label">Tên sự kiện<input name="title" required maxlength="120" placeholder="Ví dụ: Tập thể dục buổi sáng"></label><div class="form-row"><label class="field-label">Ngày<input name="event_date" type="date" required value="{{ today.isoformat() }}"></label><label class="field-label">Danh mục<select name="category"><option value="personal">Cá nhân</option><option value="work">Công việc</option><option value="health">Sức khỏe</option><option value="study">Học tập</option><option value="group_meeting">Họp nhóm</option><option value="other">Khác</option></select></label></div><div class="form-row"><label class="field-label">Mức ưu tiên<select name="priority"><option value="medium">Bình thường</option><option value="high">Cao</option><option value="low">Có thể sau</option></select></label><label class="field-label">Lặp lại<select name="repeat_rule"><option value="none">Không lặp</option><option value="daily">Hằng ngày</option><option value="weekly">Hằng tuần</option><option value="monthly">Hằng tháng</option></select></label></div><div class="form-row"><label class="field-label">Bắt đầu<input name="start_time" type="time" required value="09:00"></label><label class="field-label">Kết thúc <span class="optional">Có thể sang ngày hôm sau</span><input name="end_time" type="time" required value="10:00"></label></div><fieldset class="repeat-days-field" style="display:none"><legend>Chọn thứ lặp lại</legend><label class="repeat-interval-field">Lặp lại mỗi <input type="number" name="repeat_interval" min="1" max="52" value="1"> tuần</label><div class="repeat-day-options">{% for value,label in [(0,"Thứ hai"),(1,"Thứ ba"),(2,"Thứ tư"),(3,"Thứ năm"),(4,"Thứ sáu"),(5,"Thứ bảy"),(6,"Chủ nhật")] %}<label><input type="checkbox" name="repeat_days" value="{{ value }}">{{ label }}</label>{% endfor %}</div></fieldset><label class="field-label repeat-end-field"><span class="repeat-inline-head">Lặp đến ngày <label class="repeat-toggle"><input type="checkbox" name="repeat_forever" value="1" checked> <span>Vĩnh viễn</span></label></span><input name="repeat_until" type="date" aria-label="Lặp đến ngày"></label><label class="field-label">Ghi chú <span class="optional">Tùy chọn</span><textarea name="notes" rows="2" placeholder="Thêm vài chi tiết…"></textarea></label><label class="field-label">Mission nhỏ <span class="optional">Mỗi dòng một việc</span><textarea name="missions" rows="3" maxlength="5000" placeholder="Ví dụ: Ôn 10 từ vựng&#10;Làm 3 bài tập"></textarea></label><div class="meeting-field-group" style="display:none">
                  <div class="form-row meeting-meta-row">
                    <label class="field-label">ID cuộc họp <input name="zoom_id" type="text" inputmode="numeric" placeholder="86294973161" aria-label="ID cuộc họp Zoom"></label>
                    <label class="field-label">Mật mã <input name="zoom_password" type="text" placeholder="60000" aria-label="Mật mã Zoom"></label>
                  </div>
                  <label class="field-label meeting-link-field">Link tham gia Zoom <span class="optional">Tùy chọn</span><input name="zoom_link" type="url" placeholder="https://zoom.us/j/..." aria-label="Link tham gia Zoom"></label>
                </div><p class="form-error" id="formError"></p><div class="modal-actions"><button type="button" class="secondary-button" data-close-modal>Hủy</button><button type="submit" class="primary-button"><span id="eventSubmitLabel">Lưu sự kiện</span> <span>↗</span></button></div></form></dialog>
